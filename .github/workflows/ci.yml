name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, from the Actions page or `gh workflow run CI -f rerun_tests=true`.
  workflow_dispatch:
    inputs:
      rerun_tests:
        description: Run every test again, cached result or not
        type: boolean
        default: false

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests that run whole cycles and take minutes each. They run in a job
  # of their own, and the job for the rest leaves them out; a test not
  # listed here runs with the rest.
  CYCLE_TESTS: >-
    //:camera_cycle_test
    //:check_cycle_batch_test
    //:check_cycle_test
    //:planned_carry_test
    //:trial_runner_test

jobs:
  # Every job runs on 64-bit ARM, the platform of the machines the code is
  # developed and proved on, so that what passes there is what passes here.
  #
  # The suite, divided over jobs that run side by side: in one job on a
  # two-core runner the suite took 33 minutes. Every test target runs
  # in exactly one job, and the gate's eight pallets are divided over four.
  test:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      # A failure in one part does not stop the others.
      fail-fast: false
      matrix:
        part: [cycle tests, other tests, gate 1, gate 2, gate 3, gate 4]
    steps:
      - uses: actions/checkout@v7

      # Installs Bazelisk, which reads .bazelversion, and keeps Bazel's
      # caches between runs so MuJoCo is compiled once, not on every push.
      # The disk cache also holds test results, so a test none of whose
      # inputs changed is not run again. Each part keeps its own, since
      # each builds and runs different tests.
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-arm64-${{ matrix.part }}
          repository-cache: true

      # Optimized: the tests that run whole cycles take 5 to 70 times longer
      # unoptimized (motion_planner_test alone about 4 minutes).
      - name: Build and test
        env:
          PART: ${{ matrix.part }}
          RERUN: ${{ inputs.rerun_tests && '--nocache_test_results' || '' }}
        run: |
          case "$PART" in
            "cycle tests")
              bazel test --config=opt $RERUN $CYCLE_TESTS
              ;;
            "other tests")
              # Everything else but the gate; this part also builds the
              # programs that are not tests.
              bazel test --config=opt $RERUN --test_tag_filters=-gate -- //... \
                  $(printf ' -%s' $CYCLE_TESTS)
              ;;
            gate*)
              # One shard of the gate, two pallets at a time
              # (tests/gate_test.cc).
              bazel test --config=opt $RERUN //:gate_test \
                  --test_sharding_strategy=disabled \
                  --test_env=GATE_TOTAL_SHARDS=4 \
                  --test_env=GATE_SHARD_INDEX=$(( ${PART#gate } - 1 )) \
                  --test_env=GATE_THREADS=2
              ;;
            *)
              echo "unknown part: $PART"; exit 1
              ;;
          esac

  # The architecture checks (tools/architecture/ci.sh): the documents and the
  # dependency rules, and clang-tidy over src/ and tests/ against the counts
  # of docs/architecture/baseline.txt. Nothing here is compiled or run: the
  # script only has Bazel fetch the libraries' headers.
  architecture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The same caches as the test job, under a name of their own.
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-arm64-architecture
          repository-cache: true

      # Ubuntu 24.04 has clang-tidy 18.1.3; the checks give the same counts
      # as 18.1.8 (Debian 13), which the baseline was made with.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Architecture checks
        run: tools/architecture/ci.sh
